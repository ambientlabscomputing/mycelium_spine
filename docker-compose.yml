# Underleaf Mycelium Spine (UMS) - Docker Compose for Local Development

version: '3.8'

services:
  # MongoDB for mailbox and session persistence
  mongodb:
    image: mongo:7.0
    container_name: ums-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example_password
      MONGO_INITDB_DATABASE: mycelium_spine
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ums-network

  # Mycelium Spine service
  spine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ums-spine
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./certs:/app/certs
      - ./logs:/app/logs
    depends_on:
      - mongodb
    networks:
      - ums-network

  # Optional: Mongo Express for MongoDB UI
  mongo-express:
    image: mongo-express:latest
    container_name: ums-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example_password
      ME_CONFIG_MONGODB_URL: mongodb://root:example_password@mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - ums-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  ums-network:
    driver: bridge
