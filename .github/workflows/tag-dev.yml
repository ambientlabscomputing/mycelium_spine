name: Tag Dev on Develop Push

on:
  push:
    branches:
      - develop

jobs:
  tag-dev:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force-tag dev and sdk/dev at current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-create the root module dev tag
          git tag --force dev
          git push origin --force refs/tags/dev

          # Force-create the sdk sub-module dev tag
          git tag --force sdk/dev
          git push origin --force refs/tags/sdk/dev
